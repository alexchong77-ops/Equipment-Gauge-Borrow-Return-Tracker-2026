services:
  - type: web
    name: gauge-ledger
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    numInstances: 1
    disk:
      name: gauge-ledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
